<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}.telo{position:fixed;inset:0;background:#000;display:grid;grid-template-columns:clamp(280px, calc(100vw - (100vh - 372px) * 16 / 9), calc(100vw - 720px)) 1fr;grid-template-rows:1fr 372px}iframe{width:100%;height:100%;border:0;background:radial-gradient(ellipse 95% 110% at 25% 30%,#4d606a 0%,#303e47 34%,#202b34 66%,#151e26 100%) fixed}.left{border-right:1px solid #30363d;grid-column:1;grid-row:1/3}.bottom{border-top:1px solid #30363d;grid-column:2;grid-row:2}.palco{position:relative;min-height:0;overflow:hidden;background:#000;grid-column:2;grid-row:1}.palco button{position:absolute;top:8px;right:8px;z-index:2;background:rgba(13,17,23,.72);color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:3px 10px;cursor:pointer;font:11px "IBM Plex Mono",monospace;opacity:.55}</style></head><body><div class="telo"><iframe class="left" title="Clip e playlist"></iframe><div class="palco"><button>✕ CHIUDI PLAYOUT</button></div><iframe class="bottom" title="Comandi playout"></iframe></div><script>document.querySelector('.palco button').onclick=()=>{parent.postMessage({type:'demo-close-playout'},location.origin)};const p=new URLSearchParams(location.search);document.querySelector('.left').src='console.html?solo=rundown&'+p;document.querySelector('.bottom').src='console.html?solo=comandi&'+p;addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='typography')document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage(e.data,'*'))});</script></body></html>
