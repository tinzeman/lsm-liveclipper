<!doctype html>
<!-- ═══════════════════════════════════════════════════════════════════
     LA FINESTRA COMANDI DELLA CODA (T3) — si apre a piacimento dalla
     catalogazione (⧉ COMANDI). Parla con la pagina principale via
     BroadcastChannel: il lettore vive DI LA'; chiudere questa finestra
     non tocca l'onda. Tastiera: T=take · 1/2/3=quando · ESC=annulla ·
     spazio=onda/ferma. (Erede della finestra vecchia: rundown +
     anteprima/QUANDO/TAKE + CODA IN ONDA, «sempre a vista, non schede
     da aprire: in regia si guardano, non si cercano».)
     ═══════════════════════════════════════════════════════════════════ -->
<html lang="it"><head><meta charset="utf-8"><script src="seba-multicam.js"></script><script src="demo-backend.js"></script>
<title>PLAYOUT · coda</title>
<style>
/* ═══ IBM PLEX MONO, dal disco (2/9): lo stesso carattere delle colonne.
   La pagina sta in /microtipografia/integrated-console.html, quindi «font/…» diventa /font/…, servito
   da controllo.py. Al vivo non c'e' rete: niente da fuori. ═══ */
@font-face { font-family:"IBM Plex Mono"; font-weight:300; font-display:block;
             src:url("font/IBMPlexMono-Light.woff2") format("woff2") }
@font-face { font-family:"IBM Plex Mono"; font-weight:400; font-display:block;
             src:url("font/IBMPlexMono-Regular.woff2") format("woff2") }
@font-face { font-family:"IBM Plex Mono"; font-weight:600; font-display:block;
             src:url("font/IBMPlexMono-SemiBold.woff2") format("woff2") }
  :root { --fondo:#0d1117; --sfondo:#161b22; --riga:#30363d; --testo:#e6edf3;
          --tenue:#8b949e; --viola:#a78bfa; --verde:#3fb950; --giallo:#d29922;
          --rosso:#f85149; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--fondo); color:var(--testo);
         font:13px "IBM Plex Mono",ui-monospace,monospace; height:100vh;
         display:grid; grid-template-rows:1fr;
         /* le colonne di LETTURA si prendono tutto lo spazio (Seba: piu'
            larghe possibile); il centro e' bottoniera, gli basta il minimo */
         grid-template-columns:1fr 300px 1fr 58px;
         gap:10px; padding:10px }
  /* ── LA LEVA: la STESSA della pagina di catalogazione (Seba: «deve
     essere come nella finestra»). Stesso gesto, stesso aspetto, stesso
     significato: 100% in alto = velocita' reale, 0 = fermo immagine. ── */
  /* nessun riquadro attorno: quello della leva basta e avanza (Seba) */
  #leva { display:flex; flex-direction:column; align-items:center;
          min-height:0; overflow:hidden }
  .leva { display:flex; flex-direction:column; align-items:center; gap:8px;
          flex:1; width:100%; padding:10px 0 }     /* nuda e stretta */
  .leva .val { font:600 15px "IBM Plex Mono",ui-monospace,monospace; color:var(--testo) }
  .leva .val.fermo { color:var(--tenue) }
  .leva .eti { font:10px "IBM Plex Mono",ui-monospace,monospace; color:var(--tenue) }
  .leva input[type=range] {
    -webkit-appearance:none; appearance:none; writing-mode:vertical-lr;
    direction:rtl; width:34px; flex:1; background:transparent; accent-color:var(--viola) }
  .leva input[type=range]::-webkit-slider-runnable-track {
    width:14px; border-radius:7px;
    background:linear-gradient(0deg,
      rgba(var(--violaRGB),.9) 0 var(--p, 100%), #26323a var(--p, 100%) 100%) }
  .leva input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:34px; height:18px; border-radius:5px;
    background:var(--testo); border:1px solid #000; margin-left:-10px;
    box-shadow:0 1px 4px rgba(0,0,0,.6) }
  /* la testata non si mostra (Seba: «info inutili, guadagno spazio») —
     resta nel DOM perche' #stato/#prog li scrive la macchina */
  /* ⚠️ NASCOSTA DI SERIE, MA NON QUANDO HA QUALCOSA DA DIRE — fronte 3 del
     secondo audit: «la consolle scollegata scrive la frase giusta dentro
     #testa, che e' display:none». Cioe' il messaggio piu' importante che
     questa finestra possa mostrare — «non sono collegata» — era l'unico che
     non si poteva leggere. La classe .parla la fa comparire. */
  #testa { display:none }
  /* ⚠️ E QUANDO PARLA NON DEVE SFASCIARE LA CONSOLLE. Il corpo e' una griglia
     di QUATTRO colonne con cinque figli dentro: #testa, le tre zone e la
     leva. Nascosto, i conti tornano. Appena compariva si prendeva la prima
     colonna, le tre zone slittavano di uno e la leva finiva a capo, larga
     mezza pagina — Seba, 30/8: «la schermata cambia, cosa cazzo e' questa
     cosa?». Il messaggio non deve stare NELLA griglia: e' un avviso di
     passaggio, e va SOPRA, come una fascia. */
  #testa.parla { display:flex; gap:8px; align-items:center;
                 position:fixed; top:0; left:0; right:0; z-index:60;
                 background:#3a1414; border-bottom:1px solid var(--rosso);
                 padding:5px 8px; font-size:11px }
  #testa b { color:var(--viola); letter-spacing:.08em }
  #stato { color:var(--tenue); margin-left:auto }
  /* ── il timecode di regia: LED da rack col tally (scelto guardando il
     mockup design/playout_attrezzi.html, 3/9) ── */
  #tcRegia { background:#07090c; border:1px solid #1b2229; border-radius:9px; overflow:hidden;
             margin:-10px -10px 10px; font-family:"Courier New",Courier,monospace }
  #tcTally { height:6px; background:#2a323a; transition:background 120ms ease }
  .tcdentro { padding:11px 9px 9px; text-align:center }
  #tcFine { font:400 46px "Courier New",Courier,monospace; line-height:1; letter-spacing:2px;
            white-space:nowrap; color:#ffb000; text-shadow:0 0 14px rgba(255,176,0,.45);
            transition:color 120ms ease }
  #tcFine i { font-style:normal; opacity:.55 }   /* i frame piu' spenti dei secondi */
  .tccelle { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:11px }
  .tccella { border:1px solid #1b2229; border-radius:6px; padding:5px 7px }
  .tccella u { display:block; text-decoration:none; font:600 8.5px "IBM Plex Mono",ui-monospace,monospace;
               letter-spacing:.2em; color:#4a5560 }
  .tccella b { font:400 17px "Courier New",Courier,monospace; color:#ffb000;
               text-shadow:0 0 8px rgba(255,176,0,.35) }
  #tcDopo { margin-top:8px; font-size:11.5px; letter-spacing:.06em; color:#6e7681;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #tcRegia.spento #tcFine, #tcRegia.spento .tccella b { color:#3a3128; text-shadow:none }
  #tcRegia.canna  #tcTally { background:var(--viola) }
  #tcRegia.pronta #tcTally { background:var(--giallo) }
  #tcRegia.onda   #tcTally { background:var(--verde) }
  #tcRegia.corta  #tcTally { background:var(--rosso) }
  #tcRegia.corta  #tcFine  { color:#ff5a4e; text-shadow:0 0 14px rgba(248,81,73,.5) }
  /* ⚠️ SAVE E CLEAR RESTANO FERMI (operatore, 4/9): stanno dopo la lista, e a
     ogni voce accodata scendevano di 32 px — piu' dell'altezza del bottone.
     Con 14 voci erano sotto il bordo della finestra, e due clic su coordinate
     buone di dieci secondi prima non svuotavano niente. Adesso la lista scorre
     e il fondo resta. */
  #codaz { display:flex; flex-direction:column }
  #codaz #cdLista { flex:1 1 auto; min-height:0; overflow-y:auto }
  #codaz #cdFondo { flex:0 0 auto; margin-top:8px }
  .zona { background:var(--sfondo); border:1px solid var(--riga);
          border-radius:10px; padding:10px; overflow:auto; min-height:0 }
  /* ⚠️ DUE MODI DI MOSTRARSI, STESSA PAGINA (Seba, 3/9: «allunghiamo la colonna
     di sinistra su tutta l'altezza»). Nel playout questa consolle vive in due
     riquadri: uno alto a sinistra che mostra SOLO il rundown (clip, playlist,
     ⚡ AI) e uno in basso con tutto il resto. Si nasconde con la CSS e non si
     smonta il DOM: il codice continua a scrivere in #rdLista e in #cdLista
     senza sapere in quale dei due riquadri sta, e i gesti restano quelli. */
  body.solo-rundown { grid-template-columns:1fr }
  body.solo-rundown #centro, body.solo-rundown #codaz, body.solo-rundown #leva { display:none }
  /* ⚠️ LA COLONNA DEI COMANDI E' PIU' LARGA QUI (Seba, 3/9: «e' troppo
     stretta»). Nella striscia bassa il rundown non c'e' piu', e i 300 px
     pensati per una pagina a quattro colonne stringevano TAKE e i tre QUANDO
     senza motivo: lo spazio guadagnato lo prende chi ci lavora sopra. */
  body.senza-rundown { grid-template-columns:400px 1fr 58px }
  body.senza-rundown #rundown { display:none }
  h3 { font-size:11px; letter-spacing:.12em; color:var(--tenue); margin:0 0 8px }
  /* ── rundown ── */
  #tab { display:flex; gap:6px; margin-bottom:8px }
  #tab span { padding:3px 10px; border:1px solid var(--riga); border-radius:6px;
              cursor:pointer; color:var(--tenue) }
  #tab span.on { color:var(--testo); border-color:var(--viola) }
  .rd { display:flex; align-items:center; gap:8px; padding:6px 8px;
        border:1px solid var(--riga); border-left:3px solid var(--viola);
        border-radius:7px; margin-bottom:6px; cursor:pointer }
  .rd:hover { background:#1b2130 }
  .rd.cue { border-color:var(--giallo); background:#2a2410 }
  .rd .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .rd .d { color:var(--tenue); font-size:11px }
  /* ⚠️ GLI ATTREZZI AL PASSAGGIO, COME NELLE COLONNE DELLA PAGINA (Seba, 3/9).
     Quattro pastiglie: i tre momenti piu' l'accodamento. Al passaggio prendono
     il posto della durata, come in casa. E sulla riga IN CANNA restano accese
     anche a mouse fermo: li' non sono un attrezzo di passaggio, sono una
     domanda aperta — «questa quando?» — e una domanda non sparisce perche' hai
     mosso il mouse. */
  /* ⚠️ «+ CODA» RESTA SEMPRE A VISTA (regola di Seba: «in regia si guarda, non
     si cerca»): e' una pastiglia normale della riga. I TRE MOMENTI invece
     compaiono al passaggio e PRENDONO IL POSTO della durata — come gli
     attrezzi nelle colonne della pagina. Si nascondono con `display`, non con
     l'opacita': cosi' a riposo non occupano spazio e il nome si prende tutto.
     (Il primo tentativo li teneva sospesi sopra la riga: coprivano la durata
     e l'opacita' del gruppo schiacciava quella del «+ CODA».) */
  .rd .rdatt { display:none; gap:4px; flex:0 0 auto }
  .rd:hover .rdatt, .rd.cue .rdatt { display:flex }
  .rd:hover .d, .rd.cue .d { display:none }
  .rd .rdatt b { font:600 9.5px "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
                 color:var(--tenue); border:1px solid var(--riga); background:var(--fondo);
                 border-radius:5px; padding:4px 7px; white-space:nowrap; cursor:pointer }
  .rd .rdatt b:hover { color:var(--viola); border-color:var(--viola); background:#203730 }
  .rd .rdatt b.ora:hover  { color:var(--rosso); border-color:var(--rosso); background:#3a2a24 }
  .rd .rdatt b.piu:hover  { color:var(--verde); border-color:var(--verde); background:#16302a }
  .vuoto { color:var(--tenue); padding:8px 2px }
  /* ── centro: anteprima + take ── */
  #centro { display:flex; flex-direction:column; gap:10px }
  #prv { border:1px dashed var(--riga); border-radius:8px; padding:6px 10px }
  #prv.armata { border-color:var(--giallo) }
  #prv .chi { font-weight:600 }
  #prv .come { color:var(--tenue); font-size:11px; margin-top:4px }
  /* ⚠️ I TRE QUANDO NON SI VEDONO PIU' (Seba, 3/9): il momento si sceglie sulla
     riga, dove stai gia' guardando. Restano nel DOM — MAIUSC+1/2/3 e la
     preselezione del tasto T continuano a funzionare — ma non occupano piu'
     spazio nella bottoniera. ⚠️ La riga va spenta QUI e non piu' in alto: a
     parita' di peso vince l'ultima regola del foglio, e una `display:none`
     scritta prima perdeva contro questa. */
  #quando { display:none; gap:6px; margin:2px 0 }
  #quando span { flex:1; text-align:center; padding:7px 0; border:1px solid var(--riga);
                 border-radius:7px; cursor:pointer; color:var(--tenue);
                 letter-spacing:.06em }
  #quando span.on { color:var(--testo); border-color:var(--viola); background:#203730 }
  #tTake { padding:16px 0; text-align:center; font-size:16px; font-weight:700;
           letter-spacing:.15em; border:1px solid var(--viola); border-radius:9px;
           background:#1b1630; cursor:pointer }
  #tTake:hover { background:#241c42 }
  #tTake.conto { border-color:var(--giallo); color:var(--giallo) }
  #tAnnulla { text-align:center; padding:7px 0; border:1px solid var(--riga);
              border-radius:7px; color:var(--tenue); cursor:pointer }
  #tAnnulla:hover { color:var(--rosso); border-color:var(--rosso) }
  #tOnda { margin-top:auto; padding:13px 0; text-align:center; font-weight:700;
           letter-spacing:.12em; border:1px solid var(--verde); border-radius:9px;
           color:var(--verde); cursor:pointer }
  #tOnda.ferma { border-color:var(--rosso); color:var(--rosso) }
  #lavori { color:var(--giallo); font-size:11px; min-height:14px }
  /* ── IL BANCO DELLE ⚡, ANCHE QUI. In playout la colonna delle clip sta
     sotto il telo nero: senza questo, entrando in consolle la fila delle
     macinate diventava invisibile proprio mentre girano da sole
     (Seba, 30/8). Qui si LEGGE e basta — la ✕ sta nella colonna, fuori dal
     playout: durante una messa in onda un clic di troppo non deve poter
     annullare un lavoro. */
  #smFila { border:1px solid rgba(var(--violaRGB),.32); border-radius:8px;
            background:rgba(var(--violaRGB),.07); padding:6px 8px 5px;
            margin-bottom:8px }
  #smFila .t { font-size:9px; letter-spacing:.10em; color:var(--viola);
               text-transform:uppercase; margin-bottom:4px }
  #smFila .r { display:flex; align-items:center; gap:6px; font-size:11px;
               padding:1px 0; min-width:0 }
  #smFila .r b { font-weight:500; overflow:hidden; text-overflow:ellipsis;
                 white-space:nowrap; max-width:46% }
  #smFila .r i { font-style:normal; color:var(--rosa); font-size:10px }
  #smFila .r em { font-style:normal; color:var(--tenue); font-size:10px;
                  margin-left:auto; flex:0 0 auto }
  #smFila .r.ora em { color:var(--viola) }
  #smFila .b { flex:1 1 auto; min-width:20px; height:3px; border-radius:2px;
               background:#0d1117; overflow:hidden }
  #smFila .b u { display:block; height:100%; background:var(--viola);
                 text-decoration:none; transition:width .4s }
  #smFila .f { font:10px "IBM Plex Mono",ui-monospace,monospace; color:var(--tenue);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
               margin:1px 0 2px }
  /* ── coda in onda ── */
  .cq { display:flex; gap:8px; padding:5px 7px; border-radius:6px;
        border-left:3px solid transparent; margin-bottom:4px }
  .cq .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .cq .d { color:var(--tenue); font-size:11px }
  .cq .att { color:var(--tenue); opacity:.5; padding:0 3px; border-radius:4px;
             font-size:11px; cursor:pointer; flex:0 0 auto }
  .cq:hover .att { opacity:1 }
  .cq .att:hover { color:var(--testo); background:#2a2932 }
  .cq .att.via:hover { color:var(--rosso); background:#3a2a24 }
  .cq.passata { color:var(--tenue); opacity:.55 }
  .cq.inonda { border-left-color:var(--verde); background:#16302a; color:var(--verde) }
  .cq.accodata { border-left-color:var(--viola) }
  .cq.anteprima { border-left-color:var(--giallo); color:var(--giallo);
                  border:1px dashed var(--giallo); border-left-width:3px }
  #cdFondo { display:flex; gap:6px; margin-top:8px }
  #cdFondo > div { flex:1; text-align:center; padding:7px 0; font-size:11px;
                   letter-spacing:.04em; border:1px solid var(--riga);
                   border-radius:7px; color:var(--tenue); cursor:pointer }
  #cdSalva:hover { color:var(--testo); border-color:var(--viola) }
  #cdSvuota:hover { color:var(--rosso); border-color:var(--rosso) }
  #cdTempo { color:var(--tenue); font-size:11px; margin-bottom:6px }

/* ═══ LO STILE DELLE COLONNE, PORTATO QUI (Seba, 2/9: «usa le info che ci
   sono, non inventarti nulla, adatta lo stile grafico»). Sotto non cambia
   NIENTE di quello che si legge o si fa: stesse voci, stessi secondi, stesso
   «+ CODA», stesse ▲▼✕, stessi stati. Cambiano i colori di casa, il carattere,
   le righe a 32 px come le colonne, e i bottoni che diventano pastiglie.
   Sta in fondo al foglio apposta: qui vince. ═══ */
:root { --fondo:#191f24; --sfondo:#20272b; --riga:#2b353a; --testo:#e5ecec;
        --tenue:#96a6ac; --viola:#9dcdba; --verde:#5fd3a8; --giallo:#d3b786;
        --rosso:#ff8155; --rosa:#e9a1b8; --nomeRiposo:#aebcc1;
        /* il tema LSM (8/9): le stesse variabili della pagina, vedi il blocco in fondo */
        --violaRGB:157,205,186; --verdeRGB:95,211,168; --gialloRGB:211,183,134;
        --lsm-linea:#ffffff16; --lsm-linea2:#ffffff20; --lsm-vetro:#162027dd;
        --lsm-menta:#9dcdba; --lsm-menta-pieno:#a2cdb8; --lsm-menta-scuro:#14251c; --lsm-oro:#d3b786; --lsm-arancio:#ff8155;
        --ui:"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace }
h3 { font-weight:600 }
/* le righe del rundown e della coda: come le righe delle colonne */
.rd, .cq { min-height:32px; padding:0 6px 0 4px; margin:0; border-radius:0;
           border-bottom:1px solid rgba(255,255,255,.06); border-left:3px solid transparent;
           align-items:center; gap:6px; position:relative }
.rd:hover, .cq:hover { background:rgba(255,255,255,.04) }
.rd .n, .cq .n { font-weight:300; color:var(--nomeRiposo); font-size:12px }
.rd:hover .n, .cq:hover .n { font-weight:600; color:var(--testo) }
.rd .d, .cq .d { font-size:9.5px; font-variant-numeric:tabular-nums; color:var(--tenue);
                 white-space:nowrap; flex:0 0 auto }
/* i gesti in pastiglia: «+ CODA» resta sempre a vista (in regia si guarda,
   non si cerca), ▲▼✕ compaiono al passaggio come prima */
.rd .piu, .cq .att { font:600 10px "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.03em;
                     color:var(--tenue); border:1px solid var(--riga); border-radius:5px;
                     background:var(--sfondo); padding:0 7px; height:23px;
                     display:inline-flex; align-items:center; justify-content:center;
                     opacity:1; cursor:pointer }
.cq .att { width:24px; padding:0; font-size:13px; opacity:0 }
/* ⚠️ IL ↻ ACCESO E' UNO STATO, NON UN ATTREZZO DI PASSAGGIO (Seba, 4/9): il
   motore sta ripetendo quella voce, e in regia si deve vedere senza andarla a
   cercare col mouse. Quindi resta acceso e verde anche a mano ferma. */
.cq .att.loop.acceso { opacity:1; color:var(--verde); border-color:var(--verde);
                       background:rgba(var(--verdeRGB),.12) }
.cq:hover .att { opacity:1 }
.rd .piu:hover, .cq .att:hover { color:var(--viola); border-color:var(--viola);
                                 background:#203730 }
.cq .att.via:hover { color:var(--rosso); border-color:var(--rosso); background:#3a2a24 }
/* gli stati, con la lingua delle colonne: verde velato = pronta al play,
   verde pieno = sta girando, viola = in coda (scelta), spenta = passata */
.rd.cue { border-left-color:var(--giallo); background:rgba(var(--gialloRGB),.10) }
.rd.cue .n { color:var(--giallo); font-weight:600 }
.cq.accodata { border-left-color:var(--viola) }
/* ⚠️ L'ANTEPRIMA RESTA GIALLA E TRATTEGGIATA, com'era. Nel playout il CUE
   mette la voce in coda come PROVVISORIA (fino al TAKE o all'annulla):
   fatta verde come le altre, sembrava «aggiunta davvero» (Seba, 2/9). Il
   tratteggio dice «e' qui ma non e' ancora tua». */
.cq.anteprima { border:1px dashed var(--giallo); border-left:3px solid var(--giallo);
                background:rgba(var(--gialloRGB),.08); color:inherit }
.cq.anteprima .n { color:var(--giallo); font-weight:600 }
.cq.inonda { border-left-color:var(--verde); background:rgba(var(--verdeRGB),.22);
             box-shadow:inset 3px 0 8px -4px rgba(var(--verdeRGB),.75); color:inherit }
.cq.inonda .n { color:var(--verde); font-weight:600 }
.cq.passata { opacity:.5 }
.cq.passata .n { color:var(--tenue) }
#prv.armata { border-color:var(--verde) }
#tTake.conto { border-color:var(--verde); color:var(--verde) }
.vuoto { font-size:11.5px }
/* ═══ IL TEMA «LSM» ANCHE NELLA CONSOLLE (8/9/2026, con la pagina): dentro i due riquadri del
   playout il fondo e' trasparente e si vede lo radial-gradient(ellipse 78% 92% at 36% 44%, #3d4951 0%, #262f36 33%, #1c2329 60%, #191f24 80%) fixed della pagina; aperta da sola (una finestra
   sua) si dipinge lo stesso stage. Zone di vetro, schede menta, il TAKE arancio pieno (e' il
   «vai»), i numeri del timecode in mono chiaro, le celle NEXT CUT/CLIP in oro.

<script>
const $ = s => document.querySelector(s);

const ponte = new URLSearchParams(location.search).get('ponte');
let S = null, vistoA = 0, tabOra = 'clip', quandoOra = 'ora';
// quale meta' di se stessa mostrare: ?solo=rundown | ?solo=comandi | niente = tutta
{ const solo = new URLSearchParams(location.search).get('solo');
  if (solo === 'rundown') document.body.classList.add('solo-rundown');
  else if (solo === 'comandi') document.body.classList.add('senza-rundown'); }
// ⚠️ SI RIDISEGNA SOLO SE E' CAMBIATO QUALCOSA — lezione T19 del diario,
// ripagata qui da Seba («devo cliccare 2 volte»): lo stato batte 2 volte
// al secondo, e un clic che cade durante il ridisegno atterra su un nodo

let ultimoRd = '', ultimoCd = '';
const espansi = new Set();       // i blocchi playlist aperti nella coda

let tcPrima = null;         // il battito precedente: serve al ritmo VERO

  const d = e.data || {};
  if (!d.stato) return;
  if (ponte && d.ponte && d.ponte !== ponte) return;   // stato di un'altra pagina
  if (S && S.attiva) tcPrima = {pos: S.pos, visto: vistoA};
  S = d.stato; vistoA = Date.now();

  // non si toglieva piu': bastava un battito in ritardo — e ne arriva uno
  // ogni volta che il Mac e' carico, per esempio mentre RIFE macina — e la
  // fascia rossa restava li' per sempre, con scritto «non raggiungibile»
  // mentre la consolle stava benissimo. Un avviso che non sa spegnersi
  // diventa una bugia dopo il primo secondo.
  $('#testa').classList.remove('parla');

manda({gesto: 'stato'});
// il battito arriva dalla pagina; se tace, lo si dice (e si riprova)
setInterval(() => {

  // erano cinque battiti, e mentre RIFE macina il Mac ne perde qualcuno per
  // conto suo. Una fascia rossa che lampeggia in mezzo a una messa in onda
  // distrae nel momento peggiore, e «in ritardo» non vuol dire «morta».
  // Quattro secondi sono otto battiti: se la pagina e' viva si e' gia' fatta
  // sentire, e se e' morta lo si sa comunque in fretta.
  if (Date.now() - vistoA > 4000) {

    // di catalogazione» in playout mandava a cercare nel posto sbagliato.

function attrezzi(v, idx) {
  const i = idx !== undefined ? idx : v.i;

  // ⚠️ IL ↻ C'E' ANCHE SULLA VOCE IN ONDA (Seba, 4/9: le grafiche si mandano in
  // loop mentre girano). E' uno STATO, non un attrezzo di passaggio: acceso
  // resta acceso e si vede a mano ferma, perche' e' il MOTORE a ripetere.
  // il ↻ solo dove il ricevitore lo sa fare: lo dichiara lo stato (loopSiPuo)
  const loop = q === 1 && v.stato !== 'anteprima' && S && S.loopSiPuo
    ? '<span class="att loop' + (v.loop ? ' acceso' : '') + '" data-loop="' + i +
      '" data-on="' + (v.loop ? 0 : 1) + '" title="' +
      (v.loop ? 'smetti di ripeterla' : 'ripeti questa finche\u2019 non mandi altro') +
      '">\u21bb</span>' : '';
  if (v.stato === 'anteprima') return '';

    ? '<span class="att" data-su="' + i + '" data-q="' + q + '" title="su">&#x25b2;</span>' +
      '<span class="att" data-giu="' + i + '" data-q="' + q + '" title="giù">&#x25bc;</span>' : '';
  return loop + su + '<span class="att via" data-tog="' + i + '" data-q="' + q +

function secondi(x) { return (x >= 60 ? Math.floor(x / 60) + 'm ' : '') + (x % 60).toFixed(0) + 's'; }

function tcFermo() {

    box.className = 'pronta'; scrivi(tcDaQuadri(Math.round(s2 * F), F));

    $('#tcTaglio').textContent = tcDaQuadri(Math.round((fare[0].s || 0) * F), F).slice(3);

function dipingiTC() {

  // zeri e' peggio di mezzo secondo di niente, perche' gli zeri si LEGGONO.
  // La convenzione di casa e' la stessa delle spie: si tiene l'ultimo valore
  // buono e si dice che e' fermo, invece di inventarne uno nuovo.
  if (S.inMoto && !S.tc.fine_q && !S.tc.pos_q && tcUltimoBuono) {
    $('#tcRegia').style.opacity = '.45';       // fermo: si vede che non e' fresco
    return;

  tcUltimoBuono = true;
  $('#tcRegia').style.opacity = '';

  $('#tcRegia').className = !S.inMoto ? 'canna' : (fine < 5 * F ? 'corta' : 'onda');

let ultimoSm = '';

  else {
    const q = (sl.coda || []).length;
    let h = '<div class="t">&#x26a1; slow-mo AI \u00b7 ' +
            (sl.ora ? '1 al lavoro' : 'nessuna al lavoro') +
            (q ? ' \u00b7 ' + q + ' in fila' : '') + '</div>';
    if (sl.ora)
      h += '<div class="r ora"><b>' + sl.ora.clip + '</b><i>' + sl.ora.fattore +
           '\u00d7</i><span class="b"><u style="width:' + sl.ora.pc +
           '%"></u></span><em>' + sl.ora.pc + '%</em></div>' +
           '<div class="f">' + (sl.ora.fase || 'preparo\u2026') + '</div>';
    (sl.coda || []).forEach((x, i) => {
      h += '<div class="r"><b>' + x.clip + '</b><i>' + x.fattore +
           '\u00d7</i><em>' + (i + 1) + '\u00aa in fila</em></div>';
    });
    if (h !== ultimoSm) { box.innerHTML = h; ultimoSm = h; }
    box.style.display = '';
  }
  // il bottone onda/ferma non c'e' piu' (Seba usa lo spazio); #tOnda
  // resta nascosto nel DOM per non toccare la macchina dei gesti
  // ── coda in onda ──
  const durTot = (S.voci || []).reduce((a, v) => a + (v.s || 0), 0);
  // la barra della precarica: viva finche' lavora, poi un segno di spunta
  const pre = S.precarica;
  // ⚠️ LE CLIP OLTRE IL TETTO SI DICONO (Seba, 7/9 sera: tetto di 5 min sulla
  // precarica). Stanno in «male» con la ragione scritta, e qui si contano a
  // parte: «1 oltre 5 min» non e' un guasto, e' una scelta. Se le clip sono
  // TUTTE oltre il tetto, totale e' 0: la striscia si accende lo stesso, se
  // no l'operatore non saprebbe perche' non si e' precaricato niente.
  const saltate = (pre && pre.saltate) || 0;
  if (pre && (pre.totale || saltate)) {
    $('#precarica').style.visibility = '';     // lo spazio c'e' gia': si accende
    const pct = pre.totale ? Math.round(100 * pre.fatti / pre.totale) : 100;
    $('#precBarra').style.width = pct + '%';
    const guasti = (pre.male || []).length - saltate;
    const tetto = pre.tetto_s ? Math.round(pre.tetto_s / 60) + ' min' : 'il tetto';
    $('#precTesto').textContent = pre.stato === 'in corso'
      ? 'LOADING… ' + pre.fatti + '/' + pre.totale + (saltate ? ' · ' + saltate + ' oltre ' + tetto : '')
      : '✓ MEDIA READY' +
        (guasti > 0 ? ' · ' + guasti + ' ⚠' : '') +
        (saltate ? ' · ' + saltate + ' oltre ' + tetto + ', non precaricat' + (saltate === 1 ? 'a' : 'e') : '');
  } else { $('#precarica').style.visibility = 'hidden'; }   // si spegne, non sparisce
  dipingiTC();
  // la leva segue la verita' della pagina, tranne mentre la sto muovendo io
  if (S.rate !== undefined && Date.now() - levaMia > 1200 &&
      Math.abs(S.rate - levaOra) > 0.01) { levaOra = S.rate; levaDipingi(); }
  if (S.attiva) {
    const corta = S.inMoto && S.resta_s != null && S.resta_s < 10;
    $('#cdTempo').innerHTML = S.voci.length + ' voci · ' + secondi(durTot) +
      ' · <span style="' + (corta ? 'color:var(--rosso);font-weight:700' : '') + '">fine strada fra ' +
      (S.resta_s != null ? S.resta_s.toFixed(1) : '—') + ' s</span>' +
      (S.rifacendo && S.stima_s ? ' · <span style="color:var(--giallo)">lavori ~' + S.stima_s + ' s</span>' : '');
  } else { $('#cdTempo').textContent = '—'; }
  // clic su un blocco playlist = espandi/richiudi; DOPPIO clic su una voce
  // qualunque = riparti da li' (mai dentro l'anteprima: guardia di la')
  const righe = [];
  if (S.attiva) for (const v of S.voci) {
    const segno = v.stato === 'inonda' ? '&#x25cf; ' : v.stato === 'anteprima' ? '&#x25b6; ' : '';
    if (v.pl) {
      const ap = espansi.has(v.id);
      righe.push('<div class="cq ' + v.stato + '" data-plid="' + v.id + '" data-i="' + v.da +
        '" title="clic: apri/chiudi &middot; doppio clic: riparti dal blocco"><span class="n">' +
        (ap ? '&#x25be; ' : '&#x25b8; ') + segno + '&#x25a4; <b>' + v.nome + '</b></span>' +
        '<span class="d">' + v.quante + ' clip &middot; ' + v.s + ' s</span>' +
        attrezzi(v, v.da) + '</div>');
      // ⚠️ DENTRO IL BLOCCO SI RIORDINA (Seba, 2/9: «le playlist ha senso
      // aprirle per poter spostare le clip interne alla playlist, che ora in
      // playout non si puo' fare: posso solo eliminarle»). Le frecce muovono
      // UNA clip di UNA posizione e non escono mai dal blocco — la prima non
      // ha ▲, l'ultima non ha ▼: se no la playlist si spezzerebbe in due
      // tronconi con lo stesso nome, e il blocco e' proprio la fila di voci
      // vicine con la stessa origine.
      if (ap) v.dentro.forEach((c, k) => {
        const fermo = c.stato === 'inonda' || c.stato === 'anteprima';
        const fre = fermo || c.stato !== 'accodata' ? '' :
          (k > 0 ? '<span class="att" data-su="' + c.i + '" data-q="1" ' +
                   'title="su, dentro la playlist">&#x25b2;</span>' : '') +
          (k < v.dentro.length - 1
            ? '<span class="att" data-giu="' + c.i + '" data-q="1" ' +
              'title="giù, dentro la playlist">&#x25bc;</span>' : '');
        righe.push('<div class="cq ' + c.stato + '" data-i="' + c.i +
          '" style="margin-left:16px" title="doppio clic: riparti da qui"><span class="n">' +
          (c.stato === 'inonda' ? '&#x25cf; ' : '') +
          (c.sm ? '<span style="color:var(--giallo)">&#x26a1;' + c.sm + '\u00d7</span> ' : '') +
          c.nome + '</span>' +
          '<span class="d">' + c.s + ' s</span>' + fre +
          (fermo ? '' :
            '<span class="att via" data-tog="' + c.i + '" data-q="1" ' +
            'title="togli questa clip dalla coda">&#x2715;</span>') +
          '</div>');
      });
    } else {
      righe.push('<div class="cq ' + v.stato + '" data-i="' + v.i +
        '" title="doppio clic: riparti da qui"><span class="n">' + segno +
        (v.sm ? '<span style="color:var(--giallo)">&#x26a1;' + v.sm + '\u00d7</span> ' : '') +
        v.nome + '</span><span class="d">' + v.s + ' s</span>' + attrezzi(v) + '</div>');
    }
  }
  const cdHtml = righe.length ? righe.join('')
    : '<div class="vuoto">coda spenta: &laquo;+&raquo; su una voce per partire</div>';
  if (cdHtml !== ultimoCd) { $('#cdLista').innerHTML = cdHtml; ultimoCd = cdHtml; }
}

// ── i gesti ──
$('#tab').onclick = e => { const t = e.target.dataset.t; if (!t) return;
  tabOra = t; [...$('#tab').children].forEach(x => x.classList.toggle('on', x.dataset.t === t));
  dipingi(); };
// il paraurti anche qui: clic = anteprima (dopo 280 ms), DOPPIO clic =
// MONTA E VAI — coda pulita e quell'elemento pronto, il play resta a te
let rdClicTimer = null;
$('#rdLista').onclick = e => {
  const piu = e.target.dataset.piu;
  if (piu) { clearTimeout(rdClicTimer); rdClicTimer = null;
             manda({gesto: 'coda', nome: piu}); return; }
  // la pastiglia del momento: manda subito, e l'attesa si svuota (il resto
  // lo fa il ricevitore, gesto 'manda')
  const mnd = e.target.dataset.manda;
  if (mnd) { clearTimeout(rdClicTimer); rdClicTimer = null;
             const [nome, quando] = mnd.split('|');
             manda({gesto: 'manda', nome, quando}); return; }
  const r = e.target.closest('.rd');
  if (!r) return;
  const nome = r.dataset.n;
  clearTimeout(rdClicTimer);
  rdClicTimer = setTimeout(() => { rdClicTimer = null;
    manda({gesto: 'cue', nome}); }, 280);
};
$('#rdLista').ondblclick = e => {
  const r = e.target.closest('.rd');
  if (!r || e.target.closest('.rdatt')) return;   // le pastiglie non montano
  clearTimeout(rdClicTimer); rdClicTimer = null;
  manda({gesto: 'monta', nome: r.dataset.n});
};
$('#quando').onclick = e => { const q = e.target.closest('[data-q]');
  if (!q) return; quandoOra = q.dataset.q;
  [...$('#quando').children].forEach(x => x.classList.toggle('on', x.dataset.q === quandoOra));
  dipingi(); };
$('#tTake').onclick = () => manda({gesto: 'take', quando: quandoOra});
$('#tAnnulla').onclick = () => manda({gesto: 'annulla'});
$('#tOnda').onclick = () => manda({gesto: 'onda'});
$('#tPlay').onclick = () => manda({gesto: 'play'});
$('#tStop').onclick = () => manda({gesto: 'stop'});
// ⚠️ IL PARAURTI FRA CLIC E DOPPIO CLIC (il catVoceTimer di casa): il
// primo clic del doppio ESPANDEVA e ridisegnava la lista, il secondo
// colpo cadeva su un nodo appena nato e il doppio clic moriva — Seba
// doveva aprire il blocco e cliccare la prima clip, due passaggi. Ora
// il clic singolo aspetta 280 ms, e il doppio lo cancella.
let cdClicTimer = null;
$('#cdLista').onclick = e => {
  const t = e.target.dataset;
  if (t.loop !== undefined) { clearTimeout(cdClicTimer); cdClicTimer = null;
    manda({gesto: 'loop', i: +t.loop, on: t.on === '1'}); return; }
  if (t.tog !== undefined) { clearTimeout(cdClicTimer); cdClicTimer = null;
    manda({gesto: 'togli', i: +t.tog, q: +t.q || 1}); return; }
  if (t.su !== undefined) { clearTimeout(cdClicTimer); cdClicTimer = null;
    manda({gesto: 'sposta', i: +t.su, verso: -1, q: +t.q || 1}); return; }
  if (t.giu !== undefined) { clearTimeout(cdClicTimer); cdClicTimer = null;
    manda({gesto: 'sposta', i: +t.giu, verso: 1, q: +t.q || 1}); return; }
  const r = e.target.closest('.cq');
  if (!r || !r.dataset.plid) return;
  const id = +r.dataset.plid;
  clearTimeout(cdClicTimer);
  cdClicTimer = setTimeout(() => {
    cdClicTimer = null;
    espansi.has(id) ? espansi.delete(id) : espansi.add(id);
    ultimoCd = ''; dipingi();
  }, 280);
};
$('#cdLista').ondblclick = e => {
  clearTimeout(cdClicTimer); cdClicTimer = null;
  // ⚠️ LE PASTIGLIE NON STACCANO (Seba, 3/9). Nel caso normale il doppio clic
  // su una freccia non si forma nemmeno — premi ▲, la riga si sposta e il
  // secondo colpo cade su un'altra riga. Ma quando la freccia RIFIUTA (riga
  // gia' prima della coda, oppure «si sposta solo il futuro» su una voce in
  // onda o passata) la riga non si muove: il secondo colpo cade sullo stesso
  // ▲, il doppio clic si forma e mandava «vai», cioe' uno STACCO in onda. Ed
  // e' proprio quando insisti perche' non e' successo niente che ci arrivi.
  // Stessa guardia che le colonne clip hanno da sempre sui loro attrezzi.
  if (e.target.closest('.att')) return;
  const r = e.target.closest('.cq');
  if (!r || r.dataset.i == null) return;
  manda({gesto: 'vai', i: +r.dataset.i, quando: quandoOra});
};
// la conferma in due tempi SUL TASTO (come la vecchia consolle: niente
// finestrelle in regia): primo clic arma, secondo entro 3 s pulisce
let pulisciArmato = null;
// SAVE col nome scelto da Seba: il bottone diventa un campo — Invio
// salva, ESC annulla, vuoto = nome automatico CODA_hhmm
$('#cdSalva').onclick = () => {
  if ($('#cdSalva').querySelector('input')) return;
  $('#cdSalva').innerHTML = '<input type="text" placeholder="nome playlist…" ' +
    'style="width:92%;background:var(--fondo);color:var(--testo);' +
    'border:1px solid var(--viola);border-radius:5px;padding:3px 6px;' +
    'font:11px "IBM Plex Mono",ui-monospace,monospace;text-align:center;outline:none">';
  const campo = $('#cdSalva').querySelector('input');
  campo.focus();
  const chiudi = () => { $('#cdSalva').textContent = 'SAVE PLAYLIST'; };
  campo.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') { manda({gesto: 'salva', nome: campo.value.trim()}); chiudi(); }
    else if (e.key === 'Escape') chiudi();
  };
  campo.onblur = chiudi;
};
$('#cdSvuota').onclick = () => {
  if (pulisciArmato) {
    clearTimeout(pulisciArmato); pulisciArmato = null;
    $('#cdSvuota').textContent = 'CLEAR';
    $('#cdSvuota').style.color = ''; $('#cdSvuota').style.borderColor = '';
    manda({gesto: 'pulisci'});
    return;
  }
  $('#cdSvuota').textContent = 'SURE? click again';
  $('#cdSvuota').style.color = 'var(--rosso)';
  $('#cdSvuota').style.borderColor = 'var(--rosso)';
  pulisciArmato = setTimeout(() => {
    pulisciArmato = null;
    $('#cdSvuota').textContent = 'CLEAR';
    $('#cdSvuota').style.color = ''; $('#cdSvuota').style.borderColor = '';
  }, 3000);
};
// ── LA LEVA: lo slider vero della pagina, e il valore viaggia nel canale ──
let levaOra = 1, levaMia = 0;         // levaMia: quando l'ho toccata io
function levaDipingi() {
  const pc = Math.round(levaOra * 100);
  $('#levaSl').value = pc;
  $('#levaSl').style.setProperty('--p', pc + '%');
  $('#levaVal').textContent = pc + '%';
  $('#levaVal').classList.toggle('fermo', pc === 0);
}
$('#levaSl').oninput = () => {
  levaOra = (+$('#levaSl').value) / 100;
  levaMia = Date.now();
  levaDipingi();
  manda({gesto: 'leva', v: levaOra});
};
levaDipingi();

// ⚠️ LE TASTIERE SONO DUE E NON SI PARLANO — fronte 3 del secondo audit.
// Un keydown non attraversa il confine di un iframe: col fuoco qui dentro, I e
// O non marcavano piu' e nessuno lo diceva; e con il dito sulla LEVA — il
// controllo che in regia si tiene sotto la mano — le quattro frecce
// cambiavano il valore del cursore e mandavano al motore «leva 0.99», «0.98»,
// «0.97», «0.96». Cioe' il gesto piu' naturale della consolle rallentava
// l'onda di un punto percentuale alla volta.
// Qui i tasti che contano si INOLTRANO alla pagina dal ponte che gia' c'e',
// invece di sparire nel bordo dell'iframe.
document.addEventListener('keydown', e => {
  // ⚠️ LA LEVA E' UN <input type=range>: le frecce le mangia il browser prima
  // di chiunque altro. Si fermano QUI, e diventano il gesto giusto.
  if (e.target && e.target.id === 'levaSl' &&
      (e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
       e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight')
      manda({gesto: 'passo', d: e.key === 'ArrowRight' ? 1 : -1});
    return;
  }
  if (e.target.tagName === 'INPUT') return;   // si sta scrivendo un nome
  // I e O: marcare, che e' il mestiere. Non passavano il confine dell'iframe.
  if (e.key === 'i' || e.key === 'I') { e.preventDefault(); manda({gesto: 'segna', quale: 'dentro'}); }
  if (e.key === 'o' || e.key === 'O') { e.preventDefault(); manda({gesto: 'segna', quale: 'fuori'}); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault(); manda({gesto: 'passo', d: e.key === 'ArrowRight' ? 1 : -1});
  }
  if (e.key === 't' || e.key === 'T') { e.preventDefault(); manda({gesto: 'take', quando: quandoOra}); }
  if (e.key === 'Escape') manda({gesto: 'annulla'});
  if (e.key === ' ') { e.preventDefault(); manda({gesto: 'onda'}); }
  // ⚠️ 1/2/3 = LA CAMERA, DAPPERTUTTO — deciso da Seba il 30/8: «con quello
  // cambio la camera come faccio con 1 e 3, in pratica seleziono la camera
  // coi tasti 1 2 e 3». Prima qui dentro gli stessi tre tasti sceglievano il
  // QUANDO del take, e col fuoco sul quadro cambiavano camera: due significati
  // per lo stesso dito, decisi da quale riquadro avevi cliccato per ultimo.
  // Un tasto che fa due cose diverse a seconda di dove guardi non e' una
  // scorciatoia, e' una trappola — e in regia si preme senza guardare.
  // Il QUANDO resta sui suoi chip (si cliccano) e su MAIUSC+1/2/3.
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    e.preventDefault();
    manda({gesto: 'camera', n: +e.key});
  }
  if (e.shiftKey && (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3')) {
    e.preventDefault();
    quandoOra = {Digit1: 'ora', Digit2: 'clip', Digit3: 'coda'}[e.code];
    [...$('#quando').children].forEach(x => x.classList.toggle('on', x.dataset.q === quandoOra));
    dipingi();
  }
});
</script></body></html>
