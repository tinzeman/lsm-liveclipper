<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveClipper · confronto microtipografia</title><style>*{box-sizing:border-box}body{margin:0;background:#18232b;color:#cbd9df;font:12px -apple-system,sans-serif}nav{min-height:52px;display:flex;align-items:center;gap:8px;padding:9px 17px;flex-wrap:wrap;border-bottom:1px solid #ffffff20}nav>span{margin-right:auto}select,button{font:inherit;background:#24353f;color:#d5e0e6;border:1px solid #ffffff25;padding:7px 10px;border-radius:4px}button[aria-pressed=true]{background:#c1d7ca;color:#2b4a37}iframe{display:block;border:0;width:100%;height:calc(100vh - 52px)}small{color:#a4b7c3;margin:0 12px}</style></head><body><nav><span>MICROTIPOGRAFIA <small>Live: seba_multicam · copia senza motore</small></span><select id="page" aria-label="Pagina"><option value="work">Pagina di lavoro</option><option value="playout">Playout</option></select><select id="mode" aria-label="Modalità"><option value="live">LIVE</option><option value="catalog">CATALOG</option></select><select id="state" aria-label="Stato"><option value="progetto">Stato del progetto</option><option value="preparato">Esempio con anteprima e coda</option></select><button id="before" aria-pressed="false">Attuale</button><button id="after" aria-pressed="true">Proposta</button></nav><iframe id="scene" title="Confronto della pagina originale"></iframe><script>let refined=true;const frame=document.querySelector('#scene');function load(){frame.src=document.querySelector('#page').value+'.html?modo='+document.querySelector('#mode').value+'&stato='+document.querySelector('#state').value+'&stile='+(refined?'proposta':'attuale')}document.querySelectorAll('select').forEach(e=>e.onchange=load);for(const id of ['before','after'])document.querySelector('#'+id).onclick=()=>{refined=id==='after';document.querySelector('#before').setAttribute('aria-pressed',!refined);document.querySelector('#after').setAttribute('aria-pressed',refined);frame.contentWindow.postMessage({type:'typography',refined},'*')};addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='demo-close-playout'){document.querySelector('#page').value='work';load()}});const p=new URLSearchParams(location.search);if(p.get('vista')==='playout')document.querySelector('#page').value='playout';load();</script></body></html>
